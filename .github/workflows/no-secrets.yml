name: contrôle d'anonymisation

# Le dépôt est public : on vérifie à chaque poussée qu'aucune donnée
# identifiante n'a été réintroduite, y compris par une édition à la main.
#
# Le README cite volontairement le domaine public du portfolio et la table
# de substitution : il est exclu du contrôle des domaines, pas de celui des
# IP ni des clés.

on: [push, pull_request]

jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: IP privées et clés — sur tout le dépôt
        run: |
          if grep -rnE '\b(10\.[0-9]+\.[0-9]+\.[0-9]+|192\.168\.[0-9]+\.[0-9]+|172\.(1[6-9]|2[0-9]|3[01])\.[0-9]+\.[0-9]+)\b|BEGIN [A-Z ]*PRIVATE KEY' \
               --include='*.yaml' --include='*.yml' --include='*.md' --include='*.sh' \
               --exclude-dir='.git' . ; then
            echo "::error::IP privée ou clé détectée — relancez python3 tools/sanitize.py"
            exit 1
          fi
          echo "aucune IP privée, aucune clé"

      - name: Domaines internes — hors README et outillage
        run: |
          if grep -rnE 'netsynk\.(eu|local)' \
               --include='*.yaml' --include='*.yml' --include='*.sh' \
               --exclude-dir='.git' . ; then
            echo "::error::domaine interne détecté dans un extrait publié"
            exit 1
          fi
          echo "aucun domaine interne dans les extraits"
